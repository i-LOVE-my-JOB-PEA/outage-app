<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>บันทึกข้อมูลงานซ่อม</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>🛠️ บันทึกข้อมูลงานซ่อม</h1>
  <span class="row"><a href="/dashboard">📊 แดชบอร์ด/รายงาน</a><a href="/">← หน้าประชาชน</a><a href="#" id="logout" class="hidden">ออกจากระบบ</a></span>
</header>
<main>
  <section class="card" id="loginBox" style="max-width:380px;margin:40px auto;width:100%">
    <h2>เข้าสู่ระบบเจ้าหน้าที่</h2>
    <form id="loginForm">
      <label for="pw">รหัสผ่าน</label>
      <input id="pw" type="password" autofocus>
      <p><button>เข้าสู่ระบบ</button></p>
      <div id="loginErr" class="msg err hidden"></div>
    </form>
  </section>

  <div id="app" class="hidden" style="display:grid;gap:16px">
    <section class="card"><div id="smap"></div>
      <p class="muted" style="margin:8px 0 0">หมุดสี = เหตุที่ยังไม่ปิดงาน (ดูสถิติและพื้นที่ที่ไฟดับบ่อยที่หน้า "แดชบอร์ด/รายงาน")</p>
    </section>
    <section class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:8px">
        <h2 style="margin:0">รายการแจ้งเหตุ</h2>
        <select id="filter" style="width:auto" aria-label="กรองตามสถานะ">
          <option value="">ทุกสถานะ</option><option value="pending">รอรับเรื่อง</option>
          <option value="in_progress">กำลังซ่อม</option><option value="resolved">แก้ไขแล้ว</option>
        </select>
      </div>
      <datalist id="crewList"></datalist><datalist id="matList"></datalist>
      <div class="tablewrap"><table>
        <thead><tr><th>รหัส / เวลา</th><th>ปัญหา / ที่อยู่</th><th>ผู้แจ้ง (ชื่อเล่น)</th><th>สถานะ</th><th>ทีมช่าง / ข้อมูลงานซ่อม</th><th>บันทึก</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
    </section>
  </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/common.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let data = [], map, layer;

const gate = staffGate(() => {
  if (!map) { map = makeMap('smap'); layer = L.layerGroup().addTo(map); }
  setTimeout(() => map.invalidateSize(), 50);
  load();
});

const causeOpt = (cur) => '<option value="">ไม่ระบุสาเหตุ</option>' +
  Object.entries(CAUSE_LABEL).map(([k, v]) => `<option value="${k}" ${k === cur ? 'selected' : ''}>${v}</option>`).join('');
const opt = (cur) => Object.entries(STATUS_LABEL).map(([k, v]) => `<option value="${k}" ${k === cur ? 'selected' : ''}>${v}</option>`).join('');

// ตัวเลือกแบบดรอปดาวจากค่าที่เคยกรอก เรียงตามที่ใช้บ่อยก่อน
function usedValues(key) {
  const m = {};
  data.forEach((o) => { const v = (o[key] || '').trim(); if (v) m[v] = (m[v] || 0) + 1; });
  return Object.entries(m).sort((a, b) => b[1] - a[1]).map(([v]) => `<option value="${esc(v)}">`).join('');
}

function render() {
  const f = $('filter').value;
  layer.clearLayers();
  data.filter((o) => o.status !== 'resolved').forEach((o) =>
    pin(o).addTo(layer).bindPopup(`<b>${esc(o.code)}</b> ${TYPE_LABEL[o.type]}<br>${esc(o.address)}`));

  $('crewList').innerHTML = usedValues('crew');
  $('matList').innerHTML = usedValues('materials');
  const dupOf = (o) => { const p = data.find((x) => x.id === o.duplicateOf); return p ? p.code : '#' + o.duplicateOf; };
  $('rows').innerHTML = data.filter((o) => !f || o.status === f).map((o) => `
    <tr data-id="${o.id}">
      <td><b>${esc(o.code)}</b><div class="muted">${fmt(o.createdAt)}</div>
        ${o.duplicateOf ? `<div class="muted">⚠ ซ้ำกับ ${esc(dupOf(o))} <a href="#" class="unmerge">แยกเป็นเหตุใหม่</a></div>` : ''}</td>
      <td>${TYPE_LABEL[o.type]}<div>${esc(o.address)}</div><div class="muted">${esc(o.description)}</div></td>
      <td>${esc(o.reporterName) || '-'}<div class="muted">${esc(o.reporterPhone)}</div></td>
      <td><select class="st">${opt(o.status)}</select>
        ${o.startedAt ? `<div class="muted">เริ่ม ${fmt(o.startedAt)}</div>` : ''}${o.resolvedAt ? `<div class="muted">เสร็จ ${fmt(o.resolvedAt)}</div>` : ''}</td>
      <td><input class="crew" list="crewList" value="${esc(o.crew)}" placeholder="ชื่อทีม (เลือกจากที่เคยกรอก)" style="min-width:110px">
        <select class="cause" style="margin-top:4px" title="ต้องระบุก่อนปิดงาน">${causeOpt(o.cause)}</select>
        <input class="materials" list="matList" value="${esc(o.materials)}" placeholder="วัสดุที่ใช้ (เลือกจากที่เคยกรอก)" maxlength="300" style="margin-top:4px;min-width:110px"></td>
      <td><input class="note" placeholder="บันทึกให้ประชาชนเห็น" style="min-width:150px"></td>
      <td><button class="save">บันทึก</button></td>
    </tr>`).join('') || '<tr><td colspan="7" class="muted">ไม่มีรายการ</td></tr>';
}

$('rows').onclick = async (e) => {
  const isUnmerge = e.target.classList.contains('unmerge');
  if (!isUnmerge && !e.target.classList.contains('save')) return;
  e.preventDefault();
  const tr = e.target.closest('tr');
  if (!isUnmerge && tr.querySelector('.st').value === 'resolved' && !tr.querySelector('.cause').value) {
    tr.querySelector('.cause').focus();
    return alert('กรุณาระบุ "สาเหตุ" ก่อนปิดงาน (สถานะ แก้ไขแล้ว)');
  }
  e.target.disabled = true;
  try {
    const body = isUnmerge ? { unmerge: true } : {
      status: tr.querySelector('.st').value, crew: tr.querySelector('.crew').value, note: tr.querySelector('.note').value,
      cause: tr.querySelector('.cause').value, materials: tr.querySelector('.materials').value };
    await api('/api/outages/' + tr.dataset.id, { method: 'PATCH', body }, gate.token());
    await load();
  } catch (err) {
    alert(err.message);
    if (/เข้าสู่ระบบ/.test(err.message)) gate.expire();
  }
  e.target.disabled = false;
};
$('filter').onchange = render;

async function load() {
  data = await api('/api/outages', {}, gate.token());
  if (data.length && data[0].reporterPhone === undefined) { gate.expire(); return; } // token หมดอายุ
  render();
}

setInterval(() => { if (gate.token() && !document.activeElement.matches('input,select')) load(); }, 30000);
</script>
</body>
</html>
